name: Build CapWin Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout CapWin fork and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android native toolchain
        run: sdkmanager "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Verify CapWin JNI exports
        run: python3 tools/verify_capwin_jni_symbols.py

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capwin-launcher-debug-arm64-v8a
          if-no-files-found: error
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
