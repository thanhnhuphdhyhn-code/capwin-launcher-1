name: Build CapWin Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout CapWin fork and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android native toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf zstd
          sdkmanager "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Verify CapWin JNI exports
        run: python3 tools/verify_capwin_jni_symbols.py

      - name: Verify startup diagnostics are present
        run: |
          grep -q "STARTUP_TIMEOUT_MS" app/app/src/main/java/com/capwin/launcher/XServerDisplayActivity.java
          grep -q "getLastExecError" app/app/src/main/java/com/capwin/launcher/core/ProcessHelper.java
          grep -q "box64File.isFile" app/app/src/main/java/com/capwin/launcher/xenvironment/components/GuestProgramLauncherComponent.java

      - name: Verify Box64 interpreter matches CapWin package
        run: |
          tar --zstd -xOf app/app/src/main/assets/box64/box64-0.4.4.tzst ./usr/local/bin/box64 > /tmp/capwin-box64
          test "$(patchelf --print-interpreter /tmp/capwin-box64)" = "/data/user/0/com.capwin.launcher/files/rootfs/lib/ld-linux-aarch64.so.1"

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capwin-launcher-11.2.3-box64fix-arm64-v8a
          if-no-files-found: error
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
